    <script>
      try {
        const url = new URL(location.href);
        const key = 'paybackPy.oauthReturn';
        if (url.searchParams.has('code')) {
          const saved = JSON.parse(sessionStorage.getItem(key) || 'null');
          sessionStorage.removeItem(key);
          if (saved && Date.now() - saved.at < 900000 && Date.now() >= saved.at) {
            const params = new URLSearchParams(saved.query);
            for (const field of ['view', 'promo', 'variant']) {
              if (!url.searchParams.has(field) && params.has(field)) url.searchParams.set(field, params.get(field));
            }
            history.replaceState(null, '', url);
          }
        }
      } catch { /* A restricted browser can still sign in. */ }
    </script>

    <script>
      window.paybackAuthWatchdog = setTimeout(() => {
        const gate = document.getElementById('authGate');
        if (gate.dataset.state !== 'checking') return;
        gate.dataset.state = 'error'; gate.setAttribute('aria-busy', 'false');
        document.getElementById('authStatus').textContent = 'No pudimos cargar el acceso. Revisá tu conexión y reintentá.';
        gate.querySelector('[data-auth-retry]').hidden = false;
      }, 18000);
      document.getElementById('authGate').addEventListener('click', e => {
        if (e.target.closest('[data-auth-retry]') && !window.PaybackBeta) location.reload();
      });
    </script>
