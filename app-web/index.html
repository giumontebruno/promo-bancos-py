<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#17191c" />
    <meta name="referrer" content="strict-origin" />
    <title>Payback PY</title>
    <link rel="manifest" href="./manifest.webmanifest?v=round-logo-1" />
    <link rel="icon" href="./assets/logos/payback-py-icon-round-192.png" type="image/png" />
    <link rel="apple-touch-icon" sizes="180x180" href="./assets/logos/payback-py-launch-180.png" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="./styles.css?v=20260825-clean-map-controls" />
    <link rel="stylesheet" href="./premium.css?v=beta-13-login-cover" />
  </head>
  <body class="auth-required">
    <section id="authGate" class="auth-gate" aria-labelledby="authTitle">
      <div class="auth-gate-inner">
        <img class="auth-brand" src="./assets/logos/payback-py-wordmark.png" alt="Payback PY - Te devuelve más" />
        <div class="auth-map" role="img" aria-label="Mapa de beneficios cercanos en Asunción"></div>
        <div class="auth-copy">
          <h1 id="authTitle">Tus beneficios,<br>en un solo lugar.</h1>
          <p>Entrá para descubrir las promociones que más te convienen.</p>
        </div>
        <div class="auth-actions">
          <button type="button" class="auth-primary" data-auth-login disabled>Crear cuenta</button>
          <button type="button" class="auth-google" data-auth-login disabled><img src="./assets/logos/google-g-official.png" width="22" height="22" alt="">Continuar con Google</button>
          <button type="button" class="auth-signin" data-auth-login disabled>Ya tengo cuenta <span aria-hidden="true">·</span> <strong>Iniciar sesión</strong></button>
          <p id="authStatus" class="auth-status" role="status" aria-live="polite">Preparando el acceso…</p>
          <button type="button" class="auth-retry" data-auth-retry hidden>Reintentar</button>
        </div>
        <p class="auth-legal">Al continuar, aceptás las <a href="./terms.html">Condiciones de uso</a><br>y la <a href="./privacy.html">Política de privacidad</a>.</p>
      </div>
    </section>
    <main class="app-shell">
      <header class="topbar">
        <div class="topbar-brand">
          <a class="brand-lockup" id="homeLogo" href="./" aria-label="Payback PY: volver al inicio">
            <img class="brand-logo full-brand-logo" src="./assets/logos/payback-py-wordmark.png" alt="Payback PY - Te devuelve más" />
          </a>
        </div>
        <button id="refreshButton" class="icon-button" title="Actualizar datos" aria-label="Actualizar datos">
          <span aria-hidden="true">↻</span>
        </button>
      </header>

      <section class="controls">
        <label class="search-box">
          <span aria-hidden="true">⌕</span>
          <input id="searchInput" type="search" placeholder="Buscar local, banco, categoría o beneficio" />
        </label>
        <div class="filter-strip">
          <div class="filter-group">
            <span class="filter-label">Bancos</span>
            <div id="bankTabs" class="tabs bank-tabs"></div>
          </div>
          <div class="filter-group">
            <span class="filter-label">Categorías</span>
            <div id="categoryTabs" class="tabs category-tabs"></div>
          </div>
          <div class="filter-group">
            <span class="filter-label">Días</span>
            <div id="dayTabs" class="tabs day-tabs"></div>
          </div>
        </div>
        <div id="uenoLevelPanel" class="level-panel hidden"></div>
      </section>

      <section class="summary">
        <span id="statusText">Cargando promociones...</span>
        <span id="countText"></span>
      </section>

      <section id="results" class="results"></section>
      <footer style="display:flex;flex-wrap:wrap;gap:16px;padding:24px 0 100px;font-size:13px">
        <a href="./about.html">Acerca de Payback PY</a>
        <a href="./privacy.html">Privacidad</a>
        <a href="./terms.html">Condiciones de uso</a>
      </footer>
    </main>

    <nav id="bottomNav" class="bottom-nav" aria-label="Navegación principal">
      <button class="active" type="button" data-view="today"><span aria-hidden="true">●</span>Hoy</button>
      <button type="button" data-view="search"><span aria-hidden="true">⌕</span>Buscar</button>
      <button type="button" data-view="nearby"><span aria-hidden="true">⌖</span>Cerca</button>
      <button type="button" data-view="favorites"><span aria-hidden="true">♡</span>Favoritos</button>
      <button type="button" data-view="alerts"><span aria-hidden="true">◴</span>Perfil</button>
    </nav>

    <dialog id="promoDialog">
      <article class="dialog-card">
        <button id="closeDialog" class="close-button" title="Cerrar">x</button>
        <div id="dialogContent"></div>
      </article>
    </dialog>

    <script src="./config.js?v=20260904-google-map-key"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="./benefit-rules.js?v=20260909"></script>
    <script src="./push-client.js?v=beta-2-round-logo"></script>
    <script src="./beta-bundle.js?v=beta-3-login-cover"></script>
    <script src="./app.js?v=beta-5-category-audit"></script>
    <script>
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("./sw.js");
      }
    </script>
  </body>
</html>
