name: Refresh promotions database

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scrapers/**"
      - "promo_backend/**"
      - "requirements.txt"
      - "scripts/maintenance-health.mjs"
      - "tests/maintenance-health.test.cjs"
      - ".github/workflows/refresh-promotions.yml"
  schedule:
    # 04:00 America/Asuncion (UTC-3).
    - cron: "0 7 * * *"

permissions:
  contents: write

concurrency:
  group: promotion-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Keep baseline for anomaly checks
        run: |
          cp public/promotions.json "$RUNNER_TEMP/payback-before.json"
          echo "REFRESH_STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Refresh data
        id: refresh
        continue-on-error: true
        env:
          GOOGLE_MAPS_BACKEND_API_KEY: ${{ secrets.GOOGLE_MAPS_BACKEND_API_KEY }}
          GOOGLE_LOCATION_LIMIT: "60"
          GEOCODE_LIMIT: "0"
        run: xvfb-run -a python promo_backend/run_all.py

      # Thresholds flag operational anomalies, never validate financial terms.
      # Unsafe snapshots stay uncommitted; partial usable data keeps explicit source status.
      - name: Check freshness and catalog safety
        id: health
        if: always()
        continue-on-error: true
        run: node scripts/maintenance-health.mjs "$RUNNER_TEMP/payback-before.json"

      - name: Save source and location audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: promotion-audit
          path: |
            outputs/*report.json
            outputs/*review.json
            public/source_status.json
            outputs/maintenance_summary.md

      # Completion triggers deploy-pages via workflow_run, even on partial failure.
      # Pages validates latest main (not necessarily this trigger SHA) and public hashes.
      - name: Commit updated data
        if: steps.health.outputs.safe_to_commit == 'true'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Refresh promotions database"
          file_pattern: "outputs/*.csv outputs/*.md outputs/*.json public/*.json public/*.csv data/*.csv data/gnb_live_cards.json"

      - name: Report incomplete refresh
        if: always() && (steps.refresh.outcome != 'success' || steps.health.outcome != 'success')
        run: |
          echo "Refresh needs attention. Unsafe catalogs were not committed; partial sources retain explicit warnings. Inspect promotion-audit and the job summary."
          exit 1
