name: Refresh promotions database

on:
  workflow_dispatch:
  schedule:
    # 04:00 America/Asuncion (UTC-3).
    - cron: "0 7 * * *"

permissions:
  contents: write

concurrency:
  group: promotion-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check schedule rule
        id: schedule_rule
        if: github.event_name == 'schedule'
        shell: bash
        run: |
          echo "should_run=true" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        if: github.event_name == 'workflow_dispatch' || steps.schedule_rule.outputs.should_run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        if: github.event_name == 'workflow_dispatch' || steps.schedule_rule.outputs.should_run == 'true'
        run: pip install -r requirements.txt

      - name: Refresh data
        id: refresh
        continue-on-error: true
        if: github.event_name == 'workflow_dispatch' || steps.schedule_rule.outputs.should_run == 'true'
        env:
          GOOGLE_MAPS_BACKEND_API_KEY: ${{ secrets.GOOGLE_MAPS_BACKEND_API_KEY }}
          GOOGLE_LOCATION_LIMIT: "60"
          GEOCODE_LIMIT: "0"
        run: python promo_backend/run_all.py

      - name: Save source and location audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: promotion-audit
          path: |
            outputs/*report.json
            outputs/*review.json
            public/source_status.json

      - name: Commit updated data
        if: github.event_name == 'workflow_dispatch' || steps.schedule_rule.outputs.should_run == 'true'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Refresh promotions database"
          file_pattern: "outputs/*.csv outputs/*.md outputs/*.json public/*.json public/*.csv data/*.csv"

      - name: Report incomplete refresh
        if: steps.refresh.outcome == 'failure'
        run: |
          echo "Some sources failed. Last usable data was preserved; inspect promotion-audit."
          exit 1
