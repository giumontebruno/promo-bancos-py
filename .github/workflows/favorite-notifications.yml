name: Daily favorite notifications
on:
  workflow_dispatch:
    inputs:
      batch:
        description: 'Optional unique manual resend ID; reuse the same ID on retries to prevent duplicates'
        type: string
        default: ''
      diagnostic:
        description: 'Check provider connectivity without sending notifications'
        type: boolean
        default: false
  schedule:
    # 08:00 America/Asuncion. GitHub scheduling is best effort.
    - cron: '0 11 * * *'
permissions:
  contents: read
concurrency:
  group: favorite-notifications
  cancel-in-progress: false
jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Send opt-in favorite digest
        env:
          PAYBACK_NOTIFICATIONS_URL: ${{ secrets.PAYBACK_NOTIFICATIONS_URL }}
          PAYBACK_NOTIFICATIONS_CRON_TOKEN: ${{ secrets.PAYBACK_NOTIFICATIONS_CRON_TOKEN }}
          PAYBACK_PUSH_DIAGNOSTIC: ${{ inputs.diagnostic }}
          PAYBACK_PUSH_BATCH: ${{ inputs.batch }}
        run: python scripts/dispatch_notifications.py
